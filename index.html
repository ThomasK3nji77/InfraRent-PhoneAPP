body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t);background:var(--bg);display:flex;height:100vh;overflow:hidden}

#sb a:nth-of-type(n+5):not(.more){display:none}
#sb a.more{display:flex!important}
#mn{padding:14px 12px calc(92px + env(safe-area-inset-bottom,0px))}
/* en-têtes */
.ph{gap:8px;margin-bottom:12px}.ph h1{font-size:21px;flex:1 1 100%;line-height:1.2}
.ph>.btn,.ph>select{flex:0 0 auto}
.btn{font-size:14px;padding:8px 12px}.btn.s{padding:6px 10px;font-size:13px}
.row{gap:8px}
.tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs a{white-space:nowrap;padding:10px 14px}
.card{padding:14px;border-radius:14px}
.kp{grid-template-columns:1fr 1fr}.kp .card b{font-size:21px}.hero .big{font-size:26px}
.todo{max-width:100%}
.hero .card small:not(:first-child),.kp .card small:not(:first-child){margin-right:8px}
/* fenêtres : feuille depuis le bas */
.mb{align-items:flex-end}
.md{width:100%;max-width:100%;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:92vw}
/* menu « Plus » */
.mm .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mm .mg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--b);border-radius:12px;background:var(--h);font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;color:var(--t)}
.mm .mg a.on{border-color:var(--a);background:var(--sel);color:var(--a)}
/* planificateur */
.pf{height:auto;min-height:0}
.pf .pl{display:flex;flex-direction:column;gap:10px}
.pf .pb{height:auto;max-height:none;padding:10px 12px;overflow:visible}
.pf .pb p{display:none}
.pf .pb select{width:calc(50% - 4px)!important;display:inline-block;margin-bottom:8px!important;font-size:14px;padding:7px 28px 7px 10px}
.pf .pb .pbl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pf .pb .pi{flex:0 0 auto;min-width:130px;margin:0}
.cal.full{min-height:0}.cal.full .wk{flex:none}
.cd{min-height:64px}.cd>b{min-width:20px;height:20px;font-size:11.5px}
.ch{font-size:10px;padding:2px 4px}
.rz{width:9px;opacity:.55}
.sg{margin-top:8px}
/* lignes de devis : une carte par ligne */
.dvl .tw,.prp .tw{border:0;box-shadow:none;background:transparent;overflow:visible;border-radius:0}
.dvl table.fx,.prp table.fx{display:block;min-width:0;background:transparent;border:0;table-layout:auto}
.dvl table.fx colgroup,.prp table.fx colgroup,.dvl table.fx tr:first-child:has(th),.prp table.fx tr:first-child:has(th){display:none}
.dvl table.fx tbody,.prp table.fx tbody{display:block}
.dvl tr,.prp tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:0 0 10px;box-shadow:var(--sh)}
.dvl td,.prp td{display:block;border:0!important;padding:0!important;min-width:0;background:transparent!important}
.dvl tr:not(.ac) td::before{display:block;font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--m);margin-bottom:2px}
.dvl tr:not(.ac)>td:nth-child(1){display:none}
.dvl tr:not(.ac)>td:nth-child(2){grid-column:1/-1;order:1;font-size:15px;font-weight:600}
.dvl tr:not(.ac)>td:nth-child(4){grid-column:1/-1;order:2}
.dvl tr:not(.ac)>td:nth-child(3){order:3}.dvl tr:not(.ac)>td:nth-child(3)::before{content:"Quantité"}
.dvl tr:not(.ac)>td:nth-child(5){order:4}.dvl tr:not(.ac)>td:nth-child(5)::before{content:"Prix / jour"}
.dvl tr:not(.ac)>td:nth-child(6){order:5}.dvl tr:not(.ac)>td:nth-child(6)::before{content:"Coef."}
.dvl tr:not(.ac)>td:nth-child(7){order:6}.dvl tr:not(.ac)>td:nth-child(7)::before{content:"Remise %"}
.dvl tr:not(.ac)>td:nth-child(8){order:7;font-weight:700;font-size:15px;align-self:end}.dvl tr:not(.ac)>td:nth-child(8)::before{content:"Total"}
.dvl tr:not(.ac)>td:nth-child(9){grid-column:1/-1;order:8;display:flex;gap:8px;justify-content:flex-end;padding-top:4px!important}
.dvl tr:not(.ac)>td:nth-child(9) .btn{min-width:42px;min-height:36px}
.dvl td input:not([type=checkbox]),.dvl td select{width:100%;min-height:38px}
.dvl tr.ac{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-4px 0 10px 12px;padding:10px 12px;background:var(--h);box-shadow:none;border-radius:12px}
.dvl tr.ac td:empty{display:none}.dvl tr.ac td[colspan]{flex:1 1 100%}.dvl tr.ac td:nth-child(2){flex:1 1 100%;padding-left:0!important}
.dvl tr.ac td input:not([type=checkbox]){width:100%;max-width:none}
/* liste de préparation */
.prp tr{grid-template-columns:34px minmax(0,1fr) auto;align-items:start}
.prp tr>td:nth-child(1){grid-column:1}.prp tr>td:nth-child(2){grid-column:2;font-weight:600}.prp tr>td:nth-child(3){grid-column:3;font-weight:700}
.prp tr>td:nth-child(4){grid-column:2/-1;font-size:13px;color:var(--m)}.prp tr>td:nth-child(5){grid-column:1/-1}
.prp tr>td:empty{display:none}
.prp input[type=checkbox]{width:24px;height:24px}
.prp td input:not([type=checkbox]){width:100%;min-height:38px}
.prp tr.ac{grid-template-columns:34px minmax(0,1fr) auto;margin-left:12px;background:var(--h);box-shadow:none}
.cbh{padding:10px 4px}
/* listes : une carte par ligne (étiquettes ajoutées par le script) */
.tw table.mc{display:block;min-width:0}
.tw table.mc tbody{display:block}
.tw table.mc tr:first-child{display:none}
.tw table.mc tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--b3)}
.tw table.mc tr:nth-child(2){border-top:0}
.tw table.mc td{display:block;padding:0!important;border:0!important;font-size:13.5px;min-width:0;background:transparent!important}
.tw table.mc td:first-child{grid-column:1/-1;font-size:15px;font-weight:600}
.tw table.mc td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.tw table.mc td:empty{display:none}
.tw table.mc tr.gh{display:block;padding:9px 14px}.tw table.mc tr.gh td{font-size:13px}
.tw table.mc tr.k:active{background:var(--hv)}
.tag{white-space:nowrap}
}

@media screen and (max-width:820px){

.pf .pb select{width:calc(50% - 4px)!important}
.rz{opacity:.4}
.tw table.mc colgroup{display:none}
.tw table.mc{table-layout:auto}
}

return`<div class="ph"><h1>Tableau de bord</h1><button class="btn p" onclick="edit('evt')">+ Nouveau projet</button></div>
<div class="card"><b>À traiter</b>${todo.length?`<div class="row" style="margin:8px 0 0">${todo.map(t=>`<a class="todo ${t[3]}" onclick="${gp(t[2],t[4])}"><b>${t[0]}</b><span>${t[1]}</span></a>`).join('')}</div>`:'<p class="m" style="margin:6px 0 0">✅ Tout est à jour.</p>'}${sd.length?`<div style="margin-top:4px">${sd.slice(0,5).map(e=>{const n=Math.round((pdt(e.d1)-pdt(tdy))/864e5);return`<div class="row" style="margin:4px 0 0"><span style="flex:1"><b>${E(e.n)}</b> — ${n===0?'aujourd’hui':'dans '+n+' jour'+(n>1?'s':'')} (${fd(e.d1)}) · devis : ${E(getDev(e).etat)}</span><button class="btn s" onclick="openP('${e.id}')">Ouvrir</button></div>`}).join('')}</div>`:''}</div>
<div class="ph" style="margin-top:22px"><h3 style="flex:1;margin:0;font-size:19px">Année ${yr}</h3><button class="btn s" onclick="dyr--;render()">‹</button><button class="btn s" onclick="dyr=${cy};render()">${cy}</button><button class="btn s" onclick="dyr++;render()">›</button><button class="btn s" onclick="expStats()">Exporter (.csv)</button></div>
<div class="hero"><div class="card"><small>Chiffre d’affaires HT</small><b class="big">${eur(S.ca)}</b>${dl(S.ca,Pv.ca)}</div><div class="card"><small>Sorties d’argent</small><b class="big">${eur(S.cost)}</b><small class="m">sous-location ${eur(S.csub)} · carburant ${eur(S.cfuel)}</small></div><div class="card"><small>Marge après sorties</small><b class="big ${S.net>=0?'ok':'ko'}">${eur(S.net)}</b>${dl(S.net,Pv.net)}${S.ca?` <small class="m">· ${Math.round(S.net/S.ca*100)} % du CA</small>`:''}</div></div>${S.nocost?`<p class="m">⚠ ${S.nocost} ligne(s) de sous-location sans coût renseigné : saisissez « Coût total (loueur) » dans les devis pour calculer votre marge (mettez 0 si la location est gratuite).</p>`:''}
<div class="kp">${kp('Événements',S.n,`<small class="m">${S.conf} confirmés · ${S.term} terminés · ${S.opt} options · ${S.ann} annulés</small>`)}${kp('Encaissé (payé)','<span class="ok">'+eur(S.enc)+'</span>',`<small class="m">Reste à encaisser : ${eur(S.ca-S.enc)}</small>`)}${kp('Panier moyen',eur(S.pm),dl(S.pm,Pv.pm))}${kp('Jours d’événements',S.jours,dl(S.jours,Pv.jours))}${kp('Clients actifs',S.cl,dl(S.cl,Pv.cl))}${kp('Taux de confirmation',S.n?Math.round(S.ok/S.n*100)+' %':'—',`<small class="m">confirmés ou terminés</small>`)}</div>
<div class="card"><b>Chiffre d’affaires par mois</b> <small class="m">— ${yr} <span style="color:var(--a)">■</span> / ${yr-1} <span style="color:var(--b2)">■</span></small><div class="bars12">${S.m12.map((v,i)=>`<div class="b12" title="${MN[i]} : ${eur(v)} (${yr-1} : ${eur(Pv.m12[i])})"><div class="bb"><div class="bf p" style="height:${Math.round(Pv.m12[i]/mx*100)}%"></div><div class="bf" style="height:${Math.round(v/mx*100)}%"></div></div><small>${MN[i]}</small></div>`).join('')}</div></div>
<div class="two"><div class="card"><b>Répartition par catégorie</b>${cats.map(([c,v])=>`<div style="margin:6px 0"><div class="row" style="margin:0"><span style="flex:1">${c==='Sans catégorie'?c:stg(c)}</span><b>${eur(v)}</b></div><div style="height:6px;background:var(--b);border-radius:3px"><div style="height:6px;width:${Math.round(v/cmax*100)}%;background:${c==='Sans catégorie'?'var(--m)':col(c)};border-radius:3px"></div></div></div>`).join('')||'<p class="m">Aucune donnée.</p>'}</div><div class="card"><b>Meilleurs clients</b>${S.top.map(([n,v])=>`<div class="row" style="margin:4px 0"><span style="flex:1">${E(n)}</span><b>${eur(v)}</b></div>`).join('')||'<p class="m">Aucune donnée.</p>'}<b style="display:block;margin-top:12px">Matériel le plus loué</b><small class="m">quantité × jours</small>${S.mat.map(([n,v])=>`<div class="row" style="margin:4px 0"><span style="flex:1">${E(n)}</span><b>${v}</b></div>`).join('')||'<p class="m">Aucune donnée.</p>'}</div></div>
<div class="sh2">Historique par année</div><p class="m" style="margin-top:0">Chaque année repart à zéro ; les chiffres des années passées sont conservés et se mettent à jour si vous ajoutez ou modifiez un devis de cette année-là.</p>${tbl(['Année','Événements','CA HT','Sorties','Marge','Encaissé','Panier moyen','Jours','Évolution CA'],yrs.map(y=>{const s=ys(y),p=ys(y-1);return`<tr><td><b>${y}</b>${y<cy?' <small class="m">enregistrée</small>':''}</td><td>${s.ok} <small class="m">/ ${s.n}</small></td><td>${eur(s.ca)}</td><td>${eur(s.cost)}</td><td><b class="${s.net>=0?'ok':'ko'}">${eur(s.net)}</b></td><td>${eur(s.enc)}</td><td>${eur(s.pm)}</td><td>${s.jours}</td><td>${p.ca?dl(s.ca,p.ca):''}</td></tr>`}).join(''),'',['8%','11%','12%','11%','12%','12%','12%','6%','16%'])}
<div class="sh2">Projets non finalisés (Option / Confirmé)</div>${tbl(PH,payG(nf,projRow,PH.length,'dash:'),'Tous vos projets sont finalisés.')}`},
plan:()=>`<div class="pf"><div class="ph"><h1>Planificateur</h1><div class="row chips" style="margin:0"><button class="btn${pmode==='cal'?' on':''}" onclick="pmode='cal';render()">Projets</button><button class="btn${pmode==='staff'?' on':''}" onclick="pmode='staff';render()">Personnel</button></div><button class="btn p" onclick="edit('evt')">+ Nouveau projet</button></div>${pmode==='staff'?`<div style="flex:1;min-height:0;overflow:auto">${staffGrid()}</div>`:`<div class="pl"><div class="card pb"><b>Personnels</b><p class="m" style="margin:4px 0 8px;font-size:12px">Sélectionnez un ou plusieurs membres du personnel, puis glissez-les sur un projet (ou touchez le projet). Ils sont « à confirmer » jusqu’à validation de leur disponibilité.</p><p class="m" style="margin:0 0 8px;font-size:12px">↔ <b>Étirez le bord d’un projet</b> (poignée au survol) pour ajouter des jours de voyage, de préparation ou de rangement.</p><select style="width:100%;margin-bottom:6px" onchange="pcs=this.value;render()"><option value="">Toutes les spécialités</option>${db.spe.map(c=>`<option value="${E(c)}"${pcs===c?' selected':''}>${E(c)}</option>`).join('')}</select><select style="width:100%;margin-bottom:8px" onchange="cty=this.value;render()"><option value="">Tous les statuts</option>${db.pty.map(t=>`<option value="${E(t)}"${cty===t?' selected':''}>${E(t)}</option>`).join('')}</select><div class="pbl">${db.per.filter(p=>(!pcs||p.s.includes(pcs))&&(!cty||p.ty===cty)).map(p=>`<div class="pi${psel.includes(p.id)?' sel':''}" draggable="true" ondragstart="dragP(event,'${p.id}')" onclick="selP(event,'${p.id}')"><b>${E(p.p)} ${E(p.n)}</b>${p.ty?`<br><small class="m">${E(p.ty)}</small>`:''}<br>${p.s.map(stg).join('')}</div>`).join('')||'<p class="m">Aucun membre du personnel.</p>'}</div></div><div style="flex:1;min-width:0">${cal(db.evt.filter(e=>e.s!=='Annulé'),true)}</div></div>`}</div>`,

mat:()=>list('mat'),cli:()=>list('cli'),per:()=>list('per'),
set:()=>`<div class="ph"><h1>Paramètres</h1></div>${shareCard()}${updCard()}
<div class="card"><h3 style="margin-top:0">Apparence</h3><div class="row chips">${[['light','☀️ Clair'],['dark','🌙 Sombre'],['auto','💻 Automatique']].map(t=>`<button class="btn${(db.set.theme||'auto')===t[0]?' on':''}" onclick="setTheme('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="row"><small class="m">Couleur principale :</small>${['','#7c3aed','#059669','#ea580c','#dc2626'].map(c=>`<span class="sw" style="background:${c||'#2b5cd9'};${(db.set.acc||'')===c?'border-color:var(--t)':''}" onclick="setAccent('${c}')"></span>`).join('')}</div></div>
<div class="card"><h3 style="margin-top:0">Menu de gauche</h3><p class="m">Organisez le menu comme vous le souhaitez : glissez les lignes (ici ou directement dans le menu) ou utilisez les flèches. Décochez pour masquer une page (Paramètres reste toujours visible).</p>${navAll().map((n,i)=>`<div class="row" draggable="true" ondragstart="nvS(event,'${n[0]}')" ondragover="event.preventDefault()" ondrop="nvD(event,'${n[0]}')" style="margin-bottom:3px;cursor:grab"><span class="gr">⠿</span><label style="flex:1;display:flex;gap:6px;align-items:center"><input type="checkbox" ${n[0]==='set'||!(db.set.navOff||[]).includes(n[0])?'checked':''} ${n[0]==='set'?'disabled':''} onchange="tgNav('${n[0]}')"> ${ICO[n[0]]||n[1]} ${n[2]}</label><button class="btn s" onclick="moveNav(${i},-1)">▲</button><button class="btn s" onclick="moveNav(${i},1)">▼</button></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn" onclick="resetNav()">Rétablir l’ordre d’origine</button></div></div>
<div class="card"><h3 style="margin-top:0">Identité visuelle</h3><div class="row"><div>Logo<br>${db.set.logo?`<img src="${db.set.logo}" style="max-height:50px;background:#16233a;padding:6px;border-radius:6px">`:'<small class="m">Aucun (texte INFRA RENT)</small>'}</div><div>Icône<br>${db.set.icon?`<img src="${db.set.icon}" style="height:50px">`:'<small class="m">Aucune</small>'}</div></div><div class="row"><button class="btn" onclick="document.getElementById('lgf').click()">Importer le logo</button><input type="file" id="lgf" accept="image/*" style="display:none" onchange="imgImport(this,'logo',360)"><button class="btn" onclick="document.getElementById('icf').click()">Importer l’icône</button><input type="file" id="icf" accept="image/*" style="display:none" onchange="imgImport(this,'icon',128)">${db.set.logo||db.set.icon?'<button class="btn d" onclick="clrId()">Retirer</button>':''}</div></div>
<div class="card"><h3 style="margin-top:0">Documents (devis & factures)</h3><label>TVA par défaut (%) <input type="number" step="0.1" value="${db.set.tva}" onchange="db.set.tva=+this.value;save()"></label><p class="m">L’en-tête et les conditions ci-dessous apparaissent sur chaque devis / facture / liste de préparation exporté.</p></div>
<div class="card"><h3 style="margin-top:0">Texte d’en-tête (utilisé seulement si aucune image d’informations entreprise n’est importée)</h3>${rte('head')}</div><div class="card"><h3 style="margin-top:0">Conditions / pied de page</h3>${rte('foot')}</div>
<div class="card"><h3 style="margin-top:0">Conditions en PDF (dernière page)</h3><p class="m">Importez un PDF (conditions générales…) : chaque page est ajoutée à la fin des devis et factures, en pleine page. Une connexion internet est nécessaire pour l’import uniquement.</p><div class="row"><button class="btn" onclick="document.getElementById('cpf').click()">Importer un PDF</button><input type="file" id="cpf" accept="application/pdf" style="display:none" onchange="importPdf(this)">${(db.set.condPg||[]).length?`<b>${db.set.condPg.length} page(s)</b>${db.set.condPg.slice(0,4).map(u=>`<img src="${u}" style="height:56px;border:1px solid var(--b);background:#fff">`).join('')}<button class="btn d" onclick="db.set.condPg=[];save();render()">Retirer</button>`:'<small class="m">Aucun PDF importé</small>'}</div></div>
<div class="card"><h3 style="margin-top:0">Ordre de tri des lignes (devis, factures, listes de préparation)</h3><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${db.set.catSort!==false?'checked':''} onchange="db.set.catSort=this.checked;save();render()"> Trier automatiquement les lignes selon l’ordre ci-dessous</label><p class="m">Chaque ligne de cette liste est un bloc du devis, par exemple : Lumière (mon matériel), puis Lumière (sous-location), puis Son (mon matériel), puis Son (sous-location). Réorganisez avec les flèches. Les lignes sans catégorie passent à la fin ; à l’intérieur d’un bloc, l’ordre manuel (poignée ⠿) est conservé.</p>${ordSeq().map((k,i)=>{const p=k.split('|');return`<div class="row" draggable="true" ondragstart="sqS(event,${i})" ondragover="event.preventDefault()" ondrop="sqD(event,${i})" style="margin-bottom:3px;cursor:grab"><span class="gr">⠿</span><span style="flex:1">${i+1}. ${stg(p[0])} — ${p[1]==='i'?'mon matériel':'<b>sous-location</b> (*)'}</span><button class="btn s" onclick="moveSeq(${i},-1)">▲</button><button class="btn s" onclick="moveSeq(${i},1)">▼</button></div>`}).join('')}<div class="row" style="margin-top:8px"><button class="btn" onclick="resetSeq()">Réinitialiser (matériel puis sous-location, catégorie par catégorie)</button></div></div>
<div class="card"><h3 style="margin-top:0">Filigrane</h3><p class="m">Image placée en arrière-plan de toutes les pages exportées.</p>${db.set.wm?`<img src="${db.set.wm}" style="max-height:120px;opacity:${(db.set.wmo||12)/100}"><br>`:''}<div class="row"><button class="btn" onclick="document.getElementById('wmf').click()">Importer une image</button><input type="file" id="wmf" accept="image/*" style="display:none" onchange="imgImport(this,'wm',900)">${db.set.wm?`<label>Opacité <input type="range" min="3" max="60" value="${db.set.wmo||12}" onchange="db.set.wmo=+this.value;save();render()"></label><button class="btn d" onclick="db.set.wm='';save();render()">Retirer</button>`:''}</div></div>
<div class="card"><h3 style="margin-top:0">Mise en page des devis / factures / listes de préparation</h3><p class="m">Choisissez ce qui s’affiche dans chaque zone. Les deux zones d’une même ligne ont toujours la même hauteur.</p><div class="fg">${[['topL','Haut gauche'],['topR','Haut droite'],['midL','Milieu gauche'],['midR','Milieu droite']].map(z=>`<label><span>${z[1]}</span><select onchange="setLay('${z[0]}',this.value)">${Object.keys(SLOTS).map(k=>`<option value="${k}"${lay()[z[0]]===k?' selected':''}>${SLOTS[k]}</option>`).join('')}</select></label>`).join('')}<label><span>Mentions « à la charge du client »</span><select onchange="db.set.menPos=this.value;save();updPrev()"><option value="left">À gauche du total</option><option value="right"${db.set.menPos==='right'?' selected':''}>À droite du total</option></select></label><label><span>Couleur de la barre du numéro</span><input type="color" value="${db.set.docCol||'#1d4ed8'}" onchange="db.set.docCol=this.value;save();updPrev()" style="padding:0;height:34px"></label><label><span>Validité par défaut des devis</span><input value="${E(db.set.valid)}" onchange="db.set.valid=this.value;save();updPrev()"></label><label><span>Échéance par défaut des factures</span><input value="${E(db.set.echeance)}" onchange="db.set.echeance=this.value;save();updPrev()"></label><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" ${db.set.showCoef!==false?'checked':''} onchange="db.set.showCoef=this.checked;save();updPrev()"> Colonne « Coefficient »</label><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" ${db.set.showRem!==false?'checked':''} onchange="db.set.showRem=this.checked;save();updPrev()"> Colonne « Remise »</label><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" ${db.set.kitDetail!==false?'checked':''} onchange="db.set.kitDetail=this.checked;save();updPrev()"> Afficher le détail des kits sur les devis (par défaut)</label><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" ${db.set.catHead!==false?'checked':''} onchange="db.set.catHead=this.checked;save();updPrev()"> Afficher un intitulé par catégorie dans les devis</label><label><span>Alerte « événement proche sans devis finalisé » (jours)</span><input type="number" value="${db.set.alertDays||30}" onchange="db.set.alertDays=+this.value||30;save()"></label></div><div class="row" style="margin-top:12px"><button class="btn" onclick="document.getElementById('hif').click()">Importer mes informations entreprise (image)</button><input type="file" id="hif" accept="image/*" style="display:none" onchange="imgImport(this,'hdrImg',900)">${db.set.hdrImg?'<img src="'+db.set.hdrImg+'" style="max-height:46px;background:#fff;border:1px solid var(--b)"><button class="btn d" onclick="db.set.hdrImg=\'\';save();render()">Retirer</button>':''}<button class="btn" onclick="manageMen()">Mentions à la charge du client…</button></div></div>
<div class="card"><h3 style="margin-top:0">Aperçu d’un devis</h3><div class="row"><select onchange="pvSel=this.value;updPrev()"><option value="">Exemple</option>${db.evt.map(e=>`<option value="${e.id}"${pvSel===e.id?' selected':''}>${E(e.n)}</option>`).join('')}</select><small class="m">Rendu avec la mise en page, l’en-tête, le pied de page et le filigrane.</small></div><div id="pv">${pvHtml()}</div></div>
<div class="card"><h3 style="margin-top:0">Prix des carburants (véhicules)</h3><p class="m">Utilisés pour calculer automatiquement le coût du carburant dans les devis. ${db.fuel.d?'Dernière actualisation le '+fd(db.fuel.d)+' ('+E(db.fuel.src||'')+').':'Prix indicatifs : pas encore actualisés.'}</p><div class="fg">${FUELS.map(f=>`<label><span>${f} (€ / ${f==='Électrique'?'kWh':'L'})</span><input type="number" step="0.001" value="${fuelP(f)}" onchange="setFuel('${f}',this.value)"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="refreshFuel().then(ok=>{toast(ok?'Prix actualisés':'Actualisation impossible (connexion internet requise)');render()})">Actualiser les prix maintenant</button></div></div>
<div class="card"><h3 style="margin-top:0">Listes</h3><div class="row"><button class="btn" onclick="manage('spe')">Gérer les spécialités (métiers)</button><button class="btn" onclick="manage('pty')">Gérer les statuts du personnel</button><button class="btn" onclick="manage('cat')">Gérer les catégories de matériel</button><button class="btn" onclick="manageSta()">Gérer les statuts du matériel</button></div></div>
<div class="card"><h3 style="margin-top:0">Données</h3><p class="m">Les données sont enregistrées sur cet appareil. Sauvegardez régulièrement, ou utilisez la sauvegarde pour passer d’un appareil à l’autre.</p><div class="row"><button class="btn" onclick="expo()">Sauvegarder</button><button class="btn" onclick="document.getElementById('fi').click()">Restaurer</button></div></div>`,
kit:()=>list('kit'),ext:extPage,fac:facPage};
const locCell=(m,u)=>{const f=k=>`setU('${m.id}','${u.id}','${k}',this.value)`;return u.s===SC()?`<select onchange="${f('w')}"><option value="">— choisir le chantier —</option>${o(db.evt,e=>e.n+' ('+fd(e.d1)+')',u.w)}</select>`:`<input value="${E(u.w)}" placeholder="Ex : atelier, dépôt…" onchange="${f('w')}">`};
function numTab(m){return`<div class="row"><button class="btn s d" onclick="delSel('${m.id}')">Supprimer la sélection</button><button class="btn s d" onclick="delN('${m.id}')">Supprimer N unités en stock…</button></div>`+tbl(['','N° inventaire','N° de série','Statut','Localisation / chantier',''],m.u.map(u=>{const f=k=>`setU('${m.id}','${u.id}','${k}',this.value)`;return`<tr><td><input type="checkbox" class="usel" value="${u.id}"></td><td><b>${E(u.n)}</b></td><td><input value="${E(u.sn)}" placeholder="N° de série" onchange="${f('sn')}"></td><td><select onchange="${f('s')}">${o(US,x=>x,u.s)}</select></td><td>${locCell(m,u)}</td><td><button class="btn s" onclick="showH('${m.id}','${E(u.n)}')">🕘</button> <button class="btn s d" onclick="delU('${m.id}','${u.id}')">✕</button></td></tr>`}).join(''),'Aucune unité : cliquez sur « Ajouter des unités ».')}
function qtyTab(m){return`<p class="m">Matériel sans numéro : le stock est géré par quantité et par statut.</p>`+tbl(['Quantité','Statut','Localisation / chantier',''],m.u.map(u=>{const f=k=>`setU('${m.id}','${u.id}','${k}',this.value)`;return`<tr><td><input type="number" min="1" value="${u.q}" onchange="${f('q')}"></td><td><select onchange="${f('s')}">${o(US,x=>x,u.s)}</select></td><td>${locCell(m,u)}</td><td><button class="btn s" onclick="moveQ('${m.id}','${u.id}')">Changer le statut de N…</button> <button class="btn s d" onclick="cutQ('${m.id}','${u.id}')">Retirer…</button></td></tr>`}).join(''),'Aucun stock : cliquez sur « Ajouter du stock ».')}

if(SY.kind&&typeof indexedDB!=='undefined'){const b=await idb('readonly',s=>s.get('b'));SY.base=b?JSON.parse(b):null}}catch(e){}
if(SY.on){await sync();startPoll()}sy()}
/* mise à jour du logiciel sans reconstruction */
const APPV='22';let UPD={file:''};
const updCard=()=>`<div class="card"><h3 style="margin-top:0">Mise à jour du logiciel</h3><p class="m">Version ${APPV}.</p>${NAT&&NAT.appChoose?`<p class="m">Pour mettre à jour sans rien réinstaller : choisissez le nouveau fichier <b>index.html</b> reçu. Placez-le dans votre dossier partagé (iCloud…) : toute l’équipe utilisera la même version. ${UPD.file?'Fichier utilisé : <b>'+E(UPD.file)+'</b>.':'Actuellement : version intégrée à l’application.'}</p><div class="row"><button class="btn p" onclick="NAT.appChoose()">Choisir le fichier index.html…</button><button class="btn" onclick="NAT.appReload()">Recharger</button>${UPD.file?'<button class="btn d" onclick="NAT.appReset()">Revenir à la version intégrée</button>':''}</div>`:'<p class="m">Cette fonction existe dans l’application installée (Mac / Windows). Avec le lanceur ou la page web, remplacez simplement le fichier par le nouveau.</p>'}</div>`;
if(NAT&&NAT.appGet)NAT.appGet().then(i=>{UPD=i;if(page==='set')render()}).catch(()=>{});
/* partage des données par GitHub (ordinateurs et téléphones) */
const GHK='evpgh',ghc=()=>{try{return JSON.parse(localStorage.getItem(GHK))||{}}catch(e){return{}}},b64=t=>btoa(unescape(encodeURIComponent(t)));
async function ghApi(method,accept,body){const c=ghc();return await fetch('https://api.github.com/repos/'+encodeURIComponent(c.o)+'/'+encodeURIComponent(c.r)+'/contents/'+(c.p||'infrarent-donnees.json'),{method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+c.t,Accept:accept||'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
async function ghMeta(){const r=await ghApi('GET');if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();SY.gsha=j.sha;return j}
async function ghRead(){const m=await ghMeta();if(!m)return null;const r=await ghApi('GET','application/vnd.github.raw+json');if(!r.ok)throw new Error('GitHub '+r.status);const t=await r.text();return t.trim()?t:null}
async function ghWrite(t){const r=await ghApi('PUT',null,Object.assign({message:'INFRA RENT',content:b64(t)},SY.gsha?{sha:SY.gsha}:{}));if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('GitHub '+r.status+' '+(m||''))}const j=await r.json();SY.gsha=j.content.sha;return true}
async function ghLink(){const o=gv('gho'),r=gv('ghr'),t=gv('ght');if(!o||!r||!t){alert('Renseignez le compte, le dépôt et le jeton.');return}localStorage.setItem(GHK,JSON.stringify({o,r,t,p:'infrarent-donnees.json'}));SY.kind='gh';SY.name=o+'/'+r;try{await ghMeta()}catch(e){localStorage.removeItem(GHK);SY.kind='';alert(errTxt(e));return}await linkTail()}
function ghCopy(){const c=btoa(unescape(encodeURIComponent(JSON.stringify({o:ghc().o,r:ghc().r,t:ghc().t}))));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(()=>toast('Code copié : collez-le sur l’autre appareil'));else prompt('Copiez ce code :',c)}
async function ghUseCode(){try{const c=JSON.parse(decodeURIComponent(escape(atob(gv('ghcode')))));if(!c.o||!c.r||!c.t)throw 0;localStorage.setItem(GHK,JSON.stringify({o:c.o,r:c.r,t:c.t,p:'infrarent-donnees.json'}));SY.kind='gh';SY.name=c.o+'/'+c.r;await ghMeta();await linkTail()}catch(e){localStorage.removeItem(GHK);SY.kind='';alert('Code de connexion invalide, ou refusé par GitHub.')}}
const shareCard=()=>`<div class="card"><h3 style="margin-top:0">Travail à plusieurs et téléphone (données partagées)</h3>${SY.on?`<p>✅ Connecté : <b>${E(SY.name)}</b>${SY.kind==='gh'?' (GitHub)':''}${SY.last?' · dernière synchro '+E(SY.last):''}</p>${SY.err?`<p class="ko">⚠ ${E(SY.err)}</p>`:''}<div class="row"><button class="btn" onclick="sync()">Synchroniser maintenant</button>${SY.kind==='gh'?'<button class="btn" onclick="ghCopy()">Copier le code de connexion (autre appareil)</button>':''}<button class="btn d" onclick="unlinkFile()">Déconnecter</button></div>`:`<b>Option 1 — GitHub (ordinateurs et téléphones)</b><p class="m" style="margin-top:4px">Les données sont enregistrées dans un dépôt GitHub <b>privé</b> : tous les appareils voient les mêmes données. 1) Sur github.com, créez un dépôt privé (ex : infra-rent-donnees) avec un fichier README. 2) Créez un « fine-grained token » limité à ce dépôt, avec la permission « Contents : Read and write ». 3) Renseignez-les ci-dessous (détails dans le guide fourni).</p><div class="fg"><label><span>Compte GitHub</span><input id="gho" autocomplete="off"></label><label><span>Nom du dépôt privé</span><input id="ghr" placeholder="infra-rent-donnees" autocomplete="off"></label><label class="w"><span>Jeton d’accès (token)</span><input id="ght" type="password" autocomplete="off"></label></div><div class="row"><button class="btn p" onclick="ghLink()">Se connecter</button></div><b>Sur un 2e appareil : code de connexion</b><p class="m" style="margin-top:4px">Sur l’appareil déjà connecté, cliquez sur « Copier le code de connexion », envoyez-le (Notes, message…) puis collez-le ici.</p><div class="row"><input id="ghcode" placeholder="Collez le code ici" style="flex:1;min-width:200px"><button class="btn" onclick="ghUseCode()">Utiliser ce code</button></div>${(NAT||FSA)?`<b style="display:block;margin-top:14px">Option 2 — Fichier dans un dossier partagé (iCloud…)</b><p class="m" style="margin-top:4px">Enregistrez le fichier de données dans votre dossier partagé ; chaque personne ouvre le même fichier.</p>${SY.need?'<div class="row"><button class="btn p" onclick="reconnect()">Reconnecter le fichier</button></div>':''}<div class="row"><button class="btn" onclick="linkFile(\'new\')">Créer le fichier de données…</button><button class="btn" onclick="linkFile(\'open\')">Ouvrir un fichier existant…</button></div>`:''}`}<p class="m">Les modifications sont fusionnées automatiquement. Si deux personnes modifient exactement la même fiche au même moment, la dernière enregistrée l’emporte.</p></div>`;
if(typeof MutationObserver!=='undefined'){const mm=document.getElementById('modal');new MutationObserver(()=>{const md=mm.querySelector('.md');if(md&&!md.querySelector('.mx'))md.insertAdjacentHTML('afterbegin','<button class="mx" title="Fermer" onclick="closeM()">✕</button>')}).observe(mm,{childList:true});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&mm.innerHTML)closeM()})}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
syncInit();
</script></body></html>
